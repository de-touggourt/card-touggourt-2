<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مديرية التربية لولاية توقرت | التحقق الرسمي والبطاقة المهنية الرقمية</title>
    <!-- خط القاهرة الرسمي و FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Supabase SDK & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
    <script src="cf_photos_map.js"></script>
    
    <!-- QRious & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --primary-green: #006233;
            --emerald-dark: #004d28;
            --primary-red: #d22b2b;
            --gold: #d97706;
            --gold-light: #fef3c7;
            --dark: #0f172a;
            --slate: #334155;
            --muted: #64748b;
            --light-bg: #f8fafc;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: var(--dark);
            padding: 16px 12px 40px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
        }

        /* رأس الصفحة الرسمي */
        .portal-header {
            text-align: center;
            color: #ffffff;
            margin-bottom: 20px;
            padding: 10px 15px;
        }

        .portal-header .top-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .portal-header .ministry-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .portal-header .republic-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f1f5f9;
        }

        .portal-header .ministry-title {
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            margin-top: 2px;
        }

        .portal-header .directorate-title {
            font-size: 17px;
            font-weight: 900;
            color: #34d399;
            margin-top: 4px;
        }

        /* شارة التحقق الأمني */
        .security-badge-box {
            background: rgba(16, 185, 129, 0.15);
            border: 1.5px solid #10b981;
            border-radius: 50px;
            padding: 8px 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #6ee7b7;
            font-size: 13.5px;
            font-weight: 800;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
            animation: pulse-glow 2.5s infinite;
        }

        .security-badge-box.disabled {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
            box-shadow: 0 0 22px rgba(239, 68, 68, 0.35) !important;
            animation: none !important;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.25); }
            50% { box-shadow: 0 0 28px rgba(16, 185, 129, 0.45); }
        }

        /* تنبيه تعطيل البطاقة الرسمي */
        .card-disabled-alert-banner {
            background: #fef2f2;
            border: 2px solid #ef4444;
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.2);
            animation: shake-attention 0.6s ease;
        }

        @keyframes shake-attention {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .disabled-alert-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #fee2e2;
            color: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .disabled-alert-content {
            flex: 1;
            text-align: right;
        }

        .disabled-alert-title {
            font-size: 16.5px;
            font-weight: 900;
            color: #991b1b;
            margin-bottom: 4px;
        }

        .disabled-alert-subtitle {
            font-size: 13.5px;
            font-weight: 700;
            color: #b91c1c;
            margin-bottom: 8px;
            line-height: 1.45;
        }

        .disabled-alert-reason-box {
            background: #ffffff;
            border: 1.5px dashed #f87171;
            border-radius: 8px;
            padding: 6px 14px;
            display: inline-block;
            font-size: 13px;
            font-weight: 800;
            color: #7f1d1d;
        }

        /* بطاقة شريط التنقل الرئيسية بين الأيقونتين */
        .tabs-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 8px;
            box-shadow: var(--card-shadow);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .verify-tab-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: right;
        }

        .verify-tab-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .verify-tab-btn.active {
            background: linear-gradient(135deg, #006233 0%, #047857 100%);
            border-color: #006233;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(0, 98, 51, 0.28);
        }

        .tab-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(0, 98, 51, 0.1);
            color: var(--primary-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .verify-tab-btn.active .tab-icon-wrap {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .tab-text-wrap {
            display: flex;
            flex-direction: column;
        }

        .tab-title {
            font-size: 15px;
            font-weight: 900;
            line-height: 1.2;
        }

        .tab-sub {
            font-size: 11.5px;
            color: var(--muted);
            font-weight: 600;
            margin-top: 2px;
        }

        .verify-tab-btn.active .tab-sub {
            color: #a7f3d0;
        }

        /* المحتوى الرئيسي */
        .view-section {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==============================================================
           1. تصميم بطاقة المعلومات التفصيلية
           ============================================================== */
        .info-card-box {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .info-card-header {
            background: linear-gradient(135deg, #006233 0%, #065f46 100%);
            padding: 24px 20px 20px 20px;
            color: #ffffff;
            text-align: center;
            position: relative;
        }

        .emp-photo-container {
            width: 110px;
            height: 135px;
            border-radius: 12px;
            border: 3px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            margin: 0 auto 14px auto;
            overflow: hidden;
            background: #f1f5f9;
            position: relative;
        }

        .emp-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .emp-main-name {
            font-size: 22px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .emp-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            backdrop-filter: blur(4px);
        }

        .emp-type-badge.perm { background: rgba(16, 185, 129, 0.35); color: #ecfdf5; border: 1px solid #34d399; }
        .emp-type-badge.contract { background: rgba(59, 130, 246, 0.35); color: #eff6ff; border: 1px solid #60a5fa; }
        .emp-type-badge.sub { background: rgba(168, 85, 247, 0.35); color: #faf5ff; border: 1px solid #c084fc; }

        .info-card-body {
            padding: 20px;
        }

        .status-live-strip {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #065f46;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .info-grid { grid-template-columns: 1fr; }
        }

        .info-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-item.full-width {
            grid-column: 1 / -1;
        }

        .info-item-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item-label i {
            color: var(--primary-green);
        }

        .info-item-val {
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            word-break: break-word;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--primary-green);
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 4px;
        }

        .info-item.validity-item {
            background: #f0f9ff;
            border-color: #bae6fd;
        }

        .info-item.validity-item .info-item-val {
            color: #0369a1;
        }

        .authority-sign-box {
            margin-top: 18px;
            padding: 14px 18px;
            background: #fcfbf7;
            border: 1.5px dashed #cbd5e1;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* ==============================================================
           2. تصميم نموذج البطاقة الرقمية (مطابق تماماً للنموذج الأول والوجه الخلفي Theme 4)
           ============================================================== */
        .digital-card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .card-view-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card-action-btn {
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 13.5px;
            font-weight: 800;
            color: var(--dark);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }

        .card-action-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
            transform: translateY(-1px);
        }

        .card-action-btn.primary {
            background: linear-gradient(135deg, #006233 0%, #047857 100%);
            color: #ffffff;
            border-color: #006233;
            box-shadow: 0 4px 12px rgba(0, 98, 51, 0.25);
        }

        .card-action-btn.primary:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 98, 51, 0.35);
        }

        /* حاوية بطاقة التعريف الرقمية المتطابقة بنسبة القياس الهندسي الدقيق 750x474 */
        .card-scaler-outer {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            position: relative;
            overflow: visible;
            perspective: 1200px;
            display: flex;
            justify-content: center;
        }

        .card-scaler-inner {
            width: 750px;
            height: 474px;
            transform-origin: top center;
            position: relative;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }

        .card-flipper {
            width: 750px;
            height: 474px;
            position: relative;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-flipper.flipped {
            transform: rotateY(180deg);
        }

        .digital-card-face {
            width: 750px !important;
            height: 474px !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            backface-visibility: hidden !important;
            -webkit-backface-visibility: hidden !important;
            background: #ffffff;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            overflow: hidden !important;
            border: 1.5px solid #006233;
            border-radius: 8px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        .digital-card-face.back {
            transform: rotateY(180deg);
        }

        /* ختم التعطيل المائي الرسمي */
        .card-disabled-stamp {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            border: 5px dashed #dc2626;
            color: #dc2626;
            padding: 10px 32px;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 50;
            pointer-events: none;
            border-radius: 14px;
            background: rgba(254, 226, 226, 0.9);
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
            white-space: nowrap;
        }

        /* ---------------- تفاصيل الوجه الأمامي: مطابقة 100% للنموذج 1 ---------------- */
        .digital-card-face.front {
            background-color: #fff;
            background-image: linear-gradient(135deg, #ffffff 0%, #f4f8f6 100%);
            font-family: 'Cairo', sans-serif !important;
        }

        .digital-card-face .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background-image: url('https://pub-c986b46fc04145cfa01b9aa2c6197bac.r2.dev/cards/emp_ministry_logo_hq_circle_1792192626677_fbe8b5e4.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }

        .digital-card-face .top-deco-bar {
            width: 100%;
            height: 10px;
            display: flex;
            z-index: 10;
        }

        .digital-card-face .bar-red {
            flex: 1;
            background-color: var(--primary-red);
        }

        .digital-card-face .bar-green {
            flex: 2;
            background-color: var(--primary-green);
        }

        .digital-card-face .card-header {
            position: relative;
            z-index: 2;
            padding: 10px 15px 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100px;
            box-sizing: border-box;
        }

        .digital-card-face .main-title {
            font-family: 'Cairo', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            margin-top: -30px;
            text-align: center;
        }

        .digital-card-face .logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .digital-card-face .header-logo {
            width: 70px !important;
            height: 70px !important;
            aspect-ratio: 1 / 1 !important;
            object-fit: contain !important;
            transform: scaleX(1.06013) !important;
            transform-origin: center center !important;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
        }

        .digital-card-face .logo-text {
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 900;
            margin-top: 4px;
            white-space: nowrap;
            color: #000;
        }

        .digital-card-face .card-body {
            position: relative;
            z-index: 2;
            display: flex;
            flex-grow: 1;
            padding: 5px 25px 0 25px;
            box-sizing: border-box;
        }

        .digital-card-face .info-section {
            flex: 1;
            max-width: 505px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            padding-left: 10px;
        }

        .digital-card-face .card-name-title {
            font-family: 'Cairo', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--primary-green);
            border-bottom: 2px solid var(--primary-red);
            margin-bottom: 8px;
            width: fit-content;
        }

        .digital-card-face .info-row {
            display: flex;
            align-items: baseline;
            margin-bottom: 6px;
            font-size: 20px;
            line-height: 1.3;
        }

        .digital-card-face .label {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            color: #000;
            min-width: 120px;
            font-size: 20px;
            white-space: nowrap;
        }

        .digital-card-face .value {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            color: #000;
            margin-right: 5px;
            font-size: 20px;
        }

        .digital-card-face .info-row.workplace-row {
            display: flex;
            align-items: flex-start;
        }

        .digital-card-face .info-row.workplace-row .workplace-val {
            white-space: normal !important;
            word-break: break-word;
            line-height: 1.25;
            flex: 1;
            display: inline-block;
        }

        .digital-card-face .info-row.validity-row {
            display: flex;
            align-items: baseline;
            margin-bottom: 5px;
        }

        .digital-card-face .info-row.validity-row .validity-val {
            color: #b91c1c;
            font-weight: 700;
        }

        .digital-card-face .photo-section {
            font-family: 'Cairo', sans-serif;
            flex: 0 0 170px;
            width: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 8px;
            margin-left: 15px;
            box-sizing: border-box;
        }

        .digital-card-face .serial-number {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-red);
            background: rgba(210, 43, 43, 0.05);
            padding: 3px 10px;
            border-radius: 8px;
            width: 150px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0;
            margin-bottom: 10px;
            direction: rtl;
        }

        .digital-card-face .photo-frame {
            width: 125px;
            height: 160px;
            background-color: #fafafa;
            border: 2px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .digital-card-face .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .digital-card-face .signature-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            color: #000;
            border-top: 1px solid #ddd;
            width: 85%;
            text-align: center;
            padding-top: 4px;
        }

        /* شريط رقم التعريف الوظيفي المعتمد بدل الباركود */
        .digital-jobid-bottom-bar {
            width: 100%;
            height: 42px;
            background: rgba(0, 98, 51, 0.04);
            border-top: 1.5px dashed #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            direction: rtl;
            position: relative;
            z-index: 5;
            margin-top: auto;
            margin-bottom: 4px;
        }

        .digital-jobid-bottom-bar i {
            color: var(--primary-green);
            font-size: 22px;
        }

        .digital-jobid-bottom-bar .jobid-text {
            font-size: 17px;
            font-weight: 800;
            color: #334155;
        }

        .digital-jobid-bottom-bar .jobid-val {
            font-family: monospace;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #0f172a;
            direction: ltr;
        }

        .digital-card-face .footer {
            background-color: var(--primary-green);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;

    <!-- كود المنطق البرمجي للتحقق والعرض التفاعلي -->
    <script>
        let currentEmployee = null;
        let isCardFlipped = false;

        // دالة تصحيح وضبط الطور التعليمي ليكون حصراً: ابتدائي أو متوسط أو ثانوي
        function resolveEducationalStage(emp) {
            if (!emp) return 'ابتدائي';
            const combined = ((emp.stage || '') + ' ' + (emp.workplace || '') + ' ' + (emp.rank || '')).toLowerCase();
            
            if (combined.includes('ثانوي') || combined.includes('ثانوية') || combined.includes('lycee') || combined.includes('lycée')) {
                return 'ثانوي';
            }
            if (combined.includes('متوسط') || combined.includes('متوسطة') || combined.includes('cem')) {
                return 'متوسط';
            }
            if (combined.includes('ابتدائ') || combined.includes('مدرسة') || combined.includes('ابتدائية') || combined.includes('ep') || combined.includes('ecole')) {
                return 'ابتدائي';
            }

            const cleanStage = (emp.stage || '').trim();
            if (cleanStage === 'ابتدائي' || cleanStage === 'متوسط' || cleanStage === 'ثانوي') {
                return cleanStage;
            }
            if (cleanStage.includes('ابتدائي')) return 'ابتدائي';
            if (cleanStage.includes('متوسط')) return 'متوسط';
            if (cleanStage.includes('ثانوي')) return 'ثانوي';

            return 'ابتدائي';
        }

        // استخراج التوكن المشفر من الرابط
        function getTokenFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            let token = urlParams.get('token') || urlParams.get('v') || urlParams.get('data');
            if (!token && window.location.hash) {
                const hash = window.location.hash.substring(1);
                const hashParams = new URLSearchParams(hash);
                token = hashParams.get('token') || hash;
            }
            return token;
        }

        // ضبط قياس عرض البطاقة الرقمية هندسياً لتتناسب مع جميع الشاشات بدون أي تشويه أو قص
        function adjustCardScale() {
            const outer = document.getElementById('card-scaler-outer');
            const inner = document.getElementById('card-scaler-inner');
            if (!outer || !inner) return;
            const availableWidth = outer.clientWidth || 750;
            const scale = Math.min(1, availableWidth / 750);
            inner.style.transform = `scale(${scale})`;
            outer.style.height = `${474 * scale}px`;
        }
        window.addEventListener('resize', adjustCardScale);

        // التبديل بين بطاقة المعلومات والبطاقة الرقمية
        window.switchPortalTab = function(tabName) {
            const infoBtn = document.getElementById('tab-btn-info');
            const cardBtn = document.getElementById('tab-btn-card');
            const infoSec = document.getElementById('view-info');
            const cardSec = document.getElementById('view-card');

            if (!infoSec || !cardSec) return;

            if (tabName === 'info') {
                infoBtn.classList.add('active');
                cardBtn.classList.remove('active');
                infoSec.classList.add('active');
                cardSec.classList.remove('active');
            } else {
                cardBtn.classList.add('active');
                infoBtn.classList.remove('active');
                cardSec.classList.add('active');
                infoSec.classList.remove('active');
                // إعادة قياس البطاقة عند إظهارها
                setTimeout(adjustCardScale, 50);
            }
        };

        // قلب البطاقة الرقمية بين الوجهين الأمامي والخلفي
        window.flipDigitalCard = function() {
            const flipper = document.getElementById('digital-card-flipper');
            if (!flipper) return;
            isCardFlipped = !isCardFlipped;
            if (isCardFlipped) {
                flipper.classList.add('flipped');
            } else {
                flipper.classList.remove('flipped');
            }
        };

        // نسخ رقم التعريف الوظيفي أو الوطني
        window.copyJobId = function(val) {
            navigator.clipboard.writeText(val).then(() => {
                alert('تم النسخ بنجاح: ' + val);
            }).catch(() => {});
        };

        // رسم كود الاستجابة السريع للوجه الخلفي
        function renderBackFaceQR() {
            const canvas = document.getElementById('digital-back-qr-canvas');
            if (!canvas || typeof QRious === 'undefined') return;
            try {
                const qrContent = window.location.href || 'Directorate_of_Education_Touggourt : 0664446349';
                new QRious({
                    element: canvas,
                    value: qrContent,
                    size: 100,
                    level: 'M'
                });
            } catch (e) {
                console.warn('Back QR error:', e);
            }
        }

        // حفظ البطاقة الرقمية (صورة PNG أصلية مطابقة للنموذج الرسمي وليست بطاقة الاستعلام)
        window.saveDigitalCardImage = async function() {
            if (!currentEmployee) return;

            // تحديد الوجه المراد حفظه (الوجه الظاهر حالياً أو الوجه الأمامي كافتراضي)
            const targetId = isCardFlipped ? 'digital-card-back' : 'digital-card-front';
            const cardEl = document.getElementById(targetId);
            if (!cardEl) return;

            const btn = document.getElementById('btn-save-card-img');
            const origHTML = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري استخراج الصورة...`;
                btn.disabled = true;
            }

            try {
                if (typeof html2canvas === 'undefined') {
                    alert('مكتبة تصدير الصور غير متوفرة حالياً.');
                    return;
                }

                // التقاط البطاقة بقياسها الفعلي الكامل بدقة عالية (Retina 2x)
                const canvas = await html2canvas(cardEl, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    backgroundColor: '#ffffff'
                });

                const imageUri = canvas.toDataURL('image/png');
                const faceLabel = isCardFlipped ? 'الوجه_الخلفي' : 'الوجه_الأمامي';
                const cleanName = (currentEmployee.name || 'موظف').replace(/[/\\?%*:|"<>]/g, '_').replace(/\s+/g, '_');
                const filename = `بطاقة_مهنية_${cleanName}_${faceLabel}.png`;

                const link = document.createElement('a');
                link.download = filename;
                link.href = imageUri;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.error('Error saving digital card image:', err);
                alert('حدث خطأ أثناء حفظ صورة البطاقة. يرجى المحاولة مجدداً.');
            } finally {
                if (btn) {
                    btn.innerHTML = origHTML;
                    btn.disabled = false;
                }
            }
        };

        // تحميل كود الاستجابة السريع للبطاقة كصورة PNG عالية الدقة
        window.downloadVerificationQR = function() {
            if (!currentEmployee) return;

            const qrUrl = window.location.href;
            const tempCanvas = document.createElement('canvas');
            if (typeof QRious === 'undefined') {
                alert('مكتبة رمز الاستجابة السريع غير متوفرة.');
                return;
            }

            new QRious({
                element: tempCanvas,
                value: qrUrl,
                size: 500,
                level: 'H'
            });

            const cleanName = (currentEmployee.name || 'موظف').replace(/[/\\?%*:|"<>]/g, '_').replace(/\s+/g, '_');
            const filename = `رمز_التحقق_QR_${cleanName}.png`;

            const link = document.createElement('a');
            link.download = filename;
            link.href = tempCanvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
 
        let activeDigitalPin = '';
        let currentVerifyJobId = '';

        // دالة عرض شاشة البطاقة المعطلة (بدون أي بيانات للموظف تماماً لمنع التطفل)

                headerBadge.innerHTML = `<i class="fa-solid fa-ban"></i> بطاقة مهنية معطلة رسمياً`;
            }

            const container = document.getElementById('portal-content-container');
            container.innerHTML = `
                <div class="disabled-card-screen" style="max-width: 620px; margin: 30px auto; background: #ffffff; border: 2.5px solid #ef4444; border-radius: 22px; padding: 40px 26px; text-align: center; box-shadow: 0 12px 35px rgba(220, 38, 38, 0.16); animation: fadeIn 0.3s ease;">
                    <div style="width: 88px; height: 88px; background: #fee2e2; color: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 42px; margin: 0 auto 20px; box-shadow: 0 4px 14px rgba(220, 38, 38, 0.22); border: 2px solid #fecaca;">
                        <i class="fa-solid fa-ban"></i>
                    </div>
                    <div style="display: inline-block; background: #dc2626; color: #ffffff; font-weight: 900; font-size: 13px; padding: 5px 18px; border-radius: 20px; margin-bottom: 16px; letter-spacing: 0.5px;">
                        إشعار رسمي من مديرية التربية
                    </div>
                    <h2 style="color: #991b1b; font-size: 22px; font-weight: 900; margin: 0 0 12px; line-height: 1.4;">
                        هذه البطاقة المهنية معطلة رسمياً وغير صالحة للاستعمال
                    </h2>
                    <p style="color: #475569; font-size: 14.5px; line-height: 1.8; margin: 0 0 24px;">
                        تم إلغاء وتعطيل صلاحية هذه البطاقة المهنية رسمياً من قبل مديرية التربية لولاية توقرت.<br>
                        <strong style="color: #b91c1c;">يمنع منعاً باتاً التعامل بهذه البطاقة أو اعتمادها لأي غرض مهني، إداري أو أمني.</strong>

                    <div style="background: #fef2f2; border: 1.5px solid #fecaca; border-radius: 12px; padding: 16px 20px; text-align: right; margin-bottom: 24px;">
                        <div style="font-weight: 900; color: #991b1b; font-size: 13.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">

                        <span style="color: #0f172a;">وزارة التربية الوطنية - مديرية التربية لولاية توقرت</span>
                    </div>
                </div>
            `;
        }

        // دالة عرض شاشة قفل الصفحة بالرقم السري للبطاقة الرقمية
        function renderPinGate(jobId) {

            const container = document.getElementById('portal-content-container');

                    </div>
                    <h2 style="color: #0f172a; font-size: 20px; font-weight: 900; margin: 0 0 10px;">
                        صفحة الاستعلام محمية برقم سري

                            <label style="display: block; font-weight: 800; font-size: 13px; color: #334155; margin-bottom: 6px;">الرقم السري المعتمد:</label>
                            <div style="position: relative; display: flex; align-items: center;">

                                <button type="button" onclick="toggleVerifyPinVisibility()" style="position: absolute; right: 10px; background: none; border: none; font-size: 16px; color: #64748b; cursor: pointer; padding: 4px;" title="إظهار / إخفاء">

            setTimeout(() => {
                const inp = document.getElementById('verify-pin-input');
                if (inp) inp.focus();

        window.toggleVerifyPinVisibility = function() {
            const inp = document.getElementById('verify-pin-input');
            const icon = document.getElementById('pin-eye-icon');
            if (!inp || !icon) return;
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';

        // دالة التهيئة والتحقق الشاملة
        async function initVerificationPortal() {
            try {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token') || '';
                let rawJobId = params.get('id') || params.get('matricule') || params.get('jobId') || '';

                let decryptedData = null;
                if (token && typeof window.decryptSmartCardPayload === 'function') {
                    decryptedData = window.decryptSmartCardPayload(token);
                    if (decryptedData && decryptedData.j) {
                        rawJobId = rawJobId || decryptedData.j;
                    }
                }

                const cleanJobId = String(rawJobId || '').trim();

                if (!cleanJobId && !token) {
                    renderErrorState('لم يتم العثور على معرّف أو رمز التحقق للبطاقة. يرجى مسح رمز الاستجابة السريعة (QR) أو الباركود مباشرة من البطاقة المهنية.');
                    return;
                }

                if (!cleanJobId && token && !decryptedData) {
                    renderErrorState('رمز التحقق الرقمي غير صالح أو تعذر فك تشفيره. يرجى إعادة مسح رمز الاستجابة السريعة (QR) بدقة من البطاقة المهنية.');
                    return;
                }

            const container = document.getElementById('portal-content-container');
            container.innerHTML = `
                <div style="text-align:center; padding:50px 20px; color:#ffffff;">
                    <i class="fa-solid fa-circle-notch fa-spin fa-3x" style="color:#10b981;"></i>
                    <div style="margin-top:16px; font-weight:800; font-size:16px;">جاري التحقق المباشر من قاعدة بيانات مديرية التربية لولاية توقرت...</div>
                    <div style="margin-top:8px; font-size:13px; color:#94a3b8;">يرجى الانتظار لحظات لمطابقة سجل الموظف وتأكيد حالة البطاقة.</div>
                </div>
            `;

            let isCardDisabled = false;
            let cardDisableReason = '';
            let cardDisabledDate = '';
            let dbEmp = null;
            let issueDateMap = {};
            let template3GlobalDate = '';
            let digitalCardPin = '';
            let setDirector = 'بوعزيز صالح';

            // الاتصال المباشر بـ Supabase
            try {
                const client = (typeof window.getSupabaseClient === 'function') ? window.getSupabaseClient() : null;
                if (client) {
                    // 1. جلب إعدادات النظام وتواريخ الإصدار وقائمة التعطيل والرقم السري
                    const setPromise = client
                        .from('system_settings')
                        .select('extra_config, global_director, global_year')
                        .eq('id', 'config')
                        .maybeSingle();

                    // 2. جلب سجل الموظف الأساسي من base-touggourt عبر matricule
                    const empPromise = cleanJobId ? client
                        .from('base-touggourt')
                        .select('*')
                        .eq('matricule', cleanJobId)
                        .maybeSingle() : Promise.resolve({ data: null });

                    // 3. فحص سجل التعديلات modifications_history لضمان حالة التعطيل الحي
                    const histPromise = cleanJobId ? client
                        .from('modifications_history')
                        .select('action_type, new_data, modified_at')
                        .eq('employee_id', cleanJobId)
                        .in('action_type', ['CARD_DISABLE', 'CARD_ENABLE'])
                        .order('modified_at', { ascending: false })
                        .limit(1) : Promise.resolve({ data: null });

                    const [setRes, empRes, histRes] = await Promise.all([setPromise, empPromise, histPromise]);

                    if (setRes && setRes.data) {
                        if (setRes.data.global_director) setDirector = setRes.data.global_director;
                        const extra = setRes.data.extra_config ? ((typeof setRes.data.extra_config === 'string') ? JSON.parse(setRes.data.extra_config) : setRes.data.extra_config) : {};
                        const disabledMap = extra.disabled_cards_map || {};
                        issueDateMap = extra.issue_date_map || {};
                        template3GlobalDate = extra.template3_issue_date || '';
                        digitalCardPin = extra.digital_card_pin || '';

                        if (cleanJobId && disabledMap[cleanJobId] && disabledMap[cleanJobId].disabled) {
                            isCardDisabled = true;
                            cardDisableReason = disabledMap[cleanJobId].reason || 'معطلة بقرار إداري من مديرية التربية';
                            cardDisabledDate = disabledMap[cleanJobId].date || '';
                        }
                    }

                    if (empRes && empRes.data) {
                        dbEmp = empRes.data;
                        if (dbEmp.is_card_disabled || dbEmp.is_disabled) {
                            isCardDisabled = true;
                            cardDisableReason = dbEmp.card_disable_reason || dbEmp.disable_reason || cardDisableReason || 'معطلة بقرار إداري من مديرية التربية';
                        }
                    }

                    if (histRes && histRes.data && histRes.data.length > 0) {
                        const latestHist = histRes.data[0];
                        if (latestHist.action_type === 'CARD_DISABLE') {
                            isCardDisabled = true;
                            const hReason = (latestHist.new_data && latestHist.new_data.reason) ? latestHist.new_data.reason : '';
                            if (hReason) cardDisableReason = hReason;
                            if (latestHist.modified_at) cardDisabledDate = latestHist.modified_at;
                        } else if (latestHist.action_type === 'CARD_ENABLE') {
                            // إن كان آخر إجراء تفعيل صريح
                            isCardDisabled = false;
                        }
                    }
                }
            } catch (err) {
                console.warn("Live Supabase verification notice:", err);
            }

            // فحص حالة التعطيل إن كانت مشفرة في التوكن
            if (decryptedData && (decryptedData.dis === 1 || decryptedData.dis === '1' || decryptedData.dis === true)) {
                isCardDisabled = true;
                if (!cardDisableReason) cardDisableReason = decryptedData.disR || 'أسباب إدارية معتمدة';
            }

            // ⛔ شرط صارم: إذا كانت البطاقة معطلة، نعرض رسالة التعطيل الرسمية فوراً دون إظهار أي بيانات للموظف على الإطلاق!
            if (isCardDisabled) {
                renderCardDisabledState(cardDisableReason, cardDisabledDate);
                return;
            }

            // إذا لم يتم العثور على الموظف لا في السيرفر ولا في التوكن
            if (!dbEmp && (!decryptedData || (!decryptedData.j && !decryptedData.n))) {
                renderErrorState(`لم يتم العثور على موظف مسجل بالرقم: "${cleanJobId}". يرجى التأكد من صحة مسح البطاقة المهنية.`);
                return;
            }

            // تكوين كائن الموظف المعتمد
            const fullName = (dbEmp && (dbEmp.nomAr ? (dbEmp.nomAr + ' ' + dbEmp.prenomAr) : dbEmp.nom)) || (decryptedData && decryptedData.n) || 'الموظف';
            const empDob = cleanDateString(dbEmp ? (dbEmp.dateNais || dbEmp.dob) : (decryptedData && decryptedData.d)) || '---';
            const empRank = (dbEmp && (dbEmp.grade || dbEmp.rank)) || (decryptedData && decryptedData.r) || '---';
            const empWorkplace = (dbEmp && (dbEmp.etablissement || dbEmp.workplace || dbEmp.rawEtab)) || (decryptedData && decryptedData.w) || '---';
            const empType = (dbEmp && (dbEmp.situationAdmin || dbEmp.natureContrat)) || (decryptedData && decryptedData.t) || 'مرسم';
            const empDuration = (dbEmp && dbEmp.substitute_duration) || (decryptedData && decryptedData.u) || '';
            const empRegNo = (dbEmp && dbEmp.registry_no) || (decryptedData && decryptedData.g) || '---';
            const empNin = (dbEmp && (dbEmp.nin || dbEmp.national_id)) || (decryptedData && decryptedData.nin) || '';
            let empPhoto = (dbEmp && dbEmp.photo_url) || (decryptedData && decryptedData.p) || '';
            const empStage = (dbEmp && (dbEmp.typeEtab || dbEmp.stage)) || (decryptedData && decryptedData.s) || '';
            const empBaladiya = (dbEmp && (dbEmp.communeEtab || dbEmp.baladiya)) || (decryptedData && decryptedData.b) || '';
            const empDaaira = (dbEmp && dbEmp.daaira) || (decryptedData && decryptedData.a) || '';
            const empIssueDate = (issueDateMap && issueDateMap[cleanJobId]) || template3GlobalDate || (dbEmp && dbEmp.issue_date) || (decryptedData && decryptedData.i) || '2026';

            if (!empPhoto && window.CF_PHOTOS_MAP && cleanJobId && window.CF_PHOTOS_MAP[cleanJobId]) {
                empPhoto = window.CF_PHOTOS_MAP[cleanJobId].cfUrl;
            }

            currentEmployee = {
                jobId: cleanJobId || (decryptedData && decryptedData.j) || '',
                name: fullName,
                dob: empDob,
                rank: empRank,
                workplace: empWorkplace,
                employmentType: empType,
                substituteDuration: empDuration,
                registryNo: empRegNo,
                nin: empNin,
                nationalId: empNin,
                photoUrl: empPhoto,
                stage: empStage,
                baladiya: empBaladiya,
                daaira: empDaaira,
                issueDate: empIssueDate,
                isCardDisabled: false,
                cardDisableReason: '',
                director: setDirector || (decryptedData && decryptedData.m) || 'بوعزيز صالح',
                verifiedAt: new Date().toLocaleDateString('ar-DZ')
            };

            // 🔐 فحص قفل صفحة الاستعلام بالرقم السري إن تم إدراجه في إعدادات المديرية
            activeDigitalPin = String(digitalCardPin || '').trim();

                    return;

            // عرض البيانات والبطاقة بعد اجتياز فحص القفل
            const tabsNav = document.getElementById('tabs-navbar');
            if (tabsNav) tabsNav.style.display = 'grid';
            renderPortalViews(currentEmployee, !!dbEmp);

            renderErrorState('حدث خطأ غير متوقع أثناء معالجة بيانات التحقق: ' + (fatalErr.message || fatalErr));

    }

                                                <img src="https://pub-c986b46fc04145cfa01b9aa2c6197bac.r2.dev/cards/emp_ministry_logo_hq_circle_1792192626677_fbe8b5e4.png" class="header-logo" alt="مديرية توقرت">
                                                <div class="logo-text">مديرية التربية لولاية توقرت</div>
                                            </div>
                                        </div>

                                        <!-- جسم البطاقة -->
                                        <div class="card-body">
                                            <div class="info-section">
                                                <div class="card-name-title">بطاقة التعريف المهنية</div>
                                                <div class="info-row"><span class="label">الاسم واللقب:</span><span class="value">${emp.name}</span></div>
                                                <div class="info-row"><span class="label">تاريخ الميلاد:</span><span class="value" dir="ltr">${emp.dob}</span></div>
                                                <div class="info-row"><span class="label">الرتبة:</span><span class="value">${emp.rank}</span></div>
                                                <div class="info-row workplace-row"><span class="label">مكان العمل:</span><span class="value workplace-val">${emp.workplace}</span></div>
                                                ${validitySectionCard}
                                                <div class="info-row"><span class="label">تاريخ الإصدار:</span><span class="value" dir="ltr">${emp.issueDate}</span></div>
                                            </div>

                                            <div class="photo-section">
                                                <div class="serial-number">
                                                    <span>رقم القيد</span>
                                                    <span>${formattedRegNo}</span>
                                                </div>
                                                <div class="photo-frame">
                                                    ${photoSrc}
                                                </div>
                                                <div class="signature-title" style="line-height: 1.2;">
                                                    مدير التربية<br>
                                                    <span style="font-size: 15px; font-weight: 800; color: #000;">${emp.director}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- شريط رقم التعريف الوظيفي المعتمد بدل الباركود -->
                                        <div class="digital-jobid-bottom-bar">
                                            <i class="fa-solid fa-fingerprint"></i>
                                            <span class="jobid-text">رقم التعريف الوظيفي:</span>
                                            <span class="jobid-val">${emp.jobId}</span>
                                        </div>

                                        <!-- التذييل -->
                                        <div class="footer">
                                            على السلطات المدنية والعسكرية أن تسمح لحامل هذه البطاقة بالمرور في كل الحالات
                                        </div>
                                    </div>

                                    <!-- الوجه الخلفي للبطاقة: مطابقة 100% للنموذج الأول (Theme 4) -->
                                    <div class="digital-card-face back" id="digital-card-back" dir="rtl">
                                        ${cardDisabledStampHtml}
                                        <div class="back-header">
                                            <h3>الجمهورية الجزائرية الديمقراطية الشعبية</h3>
                                            <h2>وزارة التربية الوطنية</h2>
                                        </div>

                                        <div class="back-body">
                                            <div class="watermark-logo"></div>
                                            <div class="instructions-title">تنبيه هام</div>
                                            <ul class="rules-list-modern">
                                                <li>كل استعمال غير قانوني أو لأغراض غير مهنية للبطاقة، يعرض صاحبها لعقوبات تأديبية.</li>
                                                <li>في حالة التقاعد، الإستقالة، أو النقل خارج الولاية، يُلزم الموظف بتسليم البطاقة للإدارة.</li>
                                            </ul>
                                        </div>

                                        <div class="back-footer">
                                            <div class="return-text">
                                                في حالة العثور على هذه البطاقة، يرجى تسليمها إلى مديرية التربية لولاية توقرت أو أقرب مؤسسة تربوية.
                                            </div>
                                            <div class="qr-box">
                                                <canvas id="digital-back-qr-canvas" width="58" height="58"></canvas>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            // تنفيذ ضبط المقاسات ورسم رمز الاستجابة السريع للوجه الخلفي
            adjustCardScale();
            renderBackFaceQR();
        }

        function renderErrorState(message) {
            const container = document.getElementById('portal-content-container');
            container.innerHTML = `
                <div class="error-card">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <h3>تعذر التحقق من البطاقة المهنية</h3>
                    <p>${message}</p>
                    <div style="margin-top:20px;">
                        <a href="index.html" style="display:inline-flex; align-items:center; gap:6px; padding:10px 20px; background:#006233; color:white; border-radius:10px; text-decoration:none; font-weight:800; font-size:13.5px;">
                            <i class="fa-solid fa-arrow-right"></i> العودة للبوابة الرئيسية
                        </a>
                    </div>
                </div>
            `;
        }

        // تشغيل التحقق عند اكتمال تحميل الصفحة
        document.addEventListener('DOMContentLoaded', initVerificationPortal);
    </script>
</body>
</html>
